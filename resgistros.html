
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de registro</title>
    <link rel="stylesheet" href="css/registross.css">
</head>
<body>
    <h1>Formulario de registro</h1>

    <form action="#" method="get" id="formulario" novalidate>

        <p>
            <label for="nombre">Nombre:</label>
            <input type="text" name="nombre" id="nombre" maxlength="50">
            <span class="error" id="error-nombre"></span>
        </p>

        <p>
            <label for="apellidos">Apellidos:</label>
            <input type="text" name="apellidos" id="apellidos" maxlength="50">
            <span class="error" id="error-apellidos"></span>
        </p>

        <p>
            Sexo:
            <input type="radio" name="sexo" id="sexo-H" value="H">
            <label for="sexo-H">Hombre</label>

            <input type="radio" name="sexo" id="sexo-M" value="M">
            <label for="sexo-M">Mujer</label>
            <span class="error" id="error-sexo"></span>
        </p>

        <p>
            <label for="correo">Correo:</label>
            <input type="email" name="correo" id="correo" maxlength="100">
            <span class="error" id="error-correo"></span>
        </p>

        <p>
            <label for="estado">Población:</label>
            <select name="estado" id="estado">
                <option value="">Selecciona tu estado</option>
                <option>Aguascalientes</option>
                <option>Baja California</option>
                <option>Baja California Sur</option>
                <option>Campeche</option>
                <option>Chiapas</option>
                <option>Chihuahua</option>
                <option>Ciudad de México</option>
                <option>Coahuila de Zaragoza</option>
                <option>Colima</option>
                <option>Durango</option>
                <option>Guanajuato</option>
                <option>Guerrero</option>
                <option>Hidalgo</option>
                <option>Jalisco</option>
                <option>Estado de México</option>
                <option>Michoacán de Ocampo</option>
                <option>Morelos</option>
                <option>Nayarit</option>
                <option>Nuevo León</option>
                <option>Oaxaca</option>
                <option>Puebla</option>
                <option>Querétaro</option>
                <option>Quintana Roo</option>
                <option>San Luis Potosí</option>
                <option>Sinaloa</option>
                <option>Sonora</option>
                <option>Tabasco</option>
                <option>Tamaulipas</option>
                <option>Tlaxcala</option>
                <option>Veracruz de Ignacio de la Llave</option>
                <option>Yucatán</option>
                <option>Zacatecas</option>
            </select>
            <span class="error" id="error-estado"></span>
        </p>

        <p>
            <label for="descripcion">Descripción:</label>
            <textarea name="descripcion" id="descripcion" rows="6" cols="60"></textarea>
            <span class="error" id="error-descripcion"></span>
        </p>

        <p>
            <input type="checkbox" name="info" id="info">
            <label for="info">Declaro haber leído y aceptar las condiciones generales del programa y la normativa sobre protección de datos.</label>
            <span class="error" id="error-info"></span>
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpiar">
        </p>

        <p id="mensaje"></p>
    </form>

    <script>
        const formulario = document.getElementById("formulario");

        formulario.addEventListener("submit", function(event) {
            event.preventDefault();

            document.querySelectorAll(".error").forEach(function(error) {
                error.textContent = "";
            });

            document.querySelectorAll(".invalido").forEach(function(campo) {
                campo.classList.remove("invalido");
            });

            const mensaje = document.getElementById("mensaje");
            mensaje.textContent = "";
            mensaje.className = "";

            let valido = true;
            let primerError = null;

            function validarCampo(id, texto) {
                const campo = document.getElementById(id);

                if (campo.value.trim() === "") {
                    document.getElementById("error-" + id).textContent = texto;
                    campo.classList.add("invalido");
                    valido = false;

                    if (!primerError) {
                        primerError = campo;
                    }
                }
            }

            validarCampo("nombre", "Te falta el nombre.");
            validarCampo("apellidos", "Te faltan los apellidos.");
            validarCampo("correo", "Te falta el correo.");
            validarCampo("estado", "Selecciona tu población.");
            validarCampo("descripcion", "Te falta la descripción.");

            const correo = document.getElementById("correo");

            if (correo.value.trim() !== "" && !correo.validity.valid) {
                document.getElementById("error-correo").textContent =
                    "Escribe un correo electrónico válido.";
                correo.classList.add("invalido");
                valido = false;

                if (!primerError) {
                    primerError = correo;
                }
            }

            const sexo = document.querySelector('input[name="sexo"]:checked');

            if (!sexo) {
                document.getElementById("error-sexo").textContent =
                    "Selecciona hombre o mujer.";
                valido = false;

                if (!primerError) {
                    primerError = document.getElementById("sexo-H");
                }
            }

            const info = document.getElementById("info");

            if (!info.checked) {
                document.getElementById("error-info").textContent =
                    "Debes aceptar las condiciones.";
                valido = false;

                if (!primerError) {
                    primerError = info;
                }
            }

            if (!valido) {
                mensaje.textContent = "Revisa los campos marcados e inténtalo de nuevo.";
                mensaje.className = "aviso";

                primerError.focus();
                return;
            }

            mensaje.textContent = "¡Formulario completado correctamente!";
            mensaje.className = "exito";
        });

        document.querySelectorAll("input, select, textarea").forEach(function(campo) {
            campo.addEventListener("input", limpiarError);
            campo.addEventListener("change", limpiarError);
        });

        function limpiarError(event) {
            const campo = event.target;
            const error = document.getElementById("error-" + campo.id);

            if (error && campo.value.trim() !== "") {
                if (campo.id !== "correo" || campo.validity.valid) {
                    error.textContent = "";
                    campo.classList.remove("invalido");
                }
            }

            if (campo.name === "sexo" &&
                document.querySelector('input[name="sexo"]:checked')) {
                document.getElementById("error-sexo").textContent = "";
            }

            if (campo.id === "info" && campo.checked) {
                document.getElementById("error-info").textContent = "";
            }
        }

        formulario.addEventListener("reset", function() {
            setTimeout(function() {
                document.querySelectorAll(".error").forEach(function(error) {
                    error.textContent = "";
                });

                document.querySelectorAll(".invalido").forEach(function(campo) {
                    campo.classList.remove("invalido");
                });

                const mensaje = document.getElementById("mensaje");
                mensaje.textContent = "";
                mensaje.className = "";
            }, 0);
        });
    </script>
</body>
</html>
